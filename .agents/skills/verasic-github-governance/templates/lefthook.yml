# Verasic governance — lefthook standard for new repos
# Hooks are copied to .github/verasic-governance/hooks/ by bootstrap-repo.sh
# Pre-push governance runs via ensure-pre-push-gate.sh at top of .git/hooks/pre-push (not lefthook pre-push).
# commit-msg: run wire-hooks.sh after verasic-git-commits-convention is installed (verasic-init)

no_auto_install: true

pre-commit:
  commands:
    governance-ensure-gate:
      priority: 1
      run: bash scripts/governance/ensure-pre-push-gate.sh
    governance-pre-commit:
      run: bash .github/verasic-governance/hooks/pre-commit

pre-push:
  commands:
    test:
      run: bun run test

# commit-msg wired by wire-hooks.sh when verasic-git-commits-convention is present:
#   .agents/skills/verasic-git-commits-convention/hooks/commit-msg (preferred)
#   .cursor/skills/verasic-git-commits-convention/hooks/commit-msg
