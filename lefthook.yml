pre-commit:
  parallel: true
  commands:
    governance-pre-commit:
      run: bash .github/verasic-governance/hooks/pre-commit
    biome:
      glob: "*.{js,ts,tsx,json,jsonc}"
      run: bunx biome check --write {staged_files}
    typecheck:
      run: bun run typecheck

pre-push:
  commands:
    governance-pre-push:
      run: bash .github/verasic-governance/hooks/pre-push {1}
    test:
      run: bun run test

commit-msg:
  commands:
    verasic:
      run: bash .agents/skills/verasic-git-commits-convention/hooks/commit-msg {1}
