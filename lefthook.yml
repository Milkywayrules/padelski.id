no_auto_install: true

pre-commit:
  commands:
    governance-ensure-gate:
      priority: 1
      run: bash scripts/governance/ensure-pre-push-gate.sh
    governance-pre-commit:
      run: bash .github/verasic-governance/hooks/pre-commit
    biome:
      glob: "**/*.{js,ts,tsx,json,jsonc}"
      exclude:
        - ".cursor/hooks.json"
      run: bunx biome check --write {staged_files}
    typecheck:
      run: bun run typecheck

pre-push:
  commands:
    test:
      run: bun run test

commit-msg:
  commands:
    verasic:
      run: bash .agents/skills/verasic-git-commits-convention/hooks/commit-msg {1}
