pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc}"
      run: bunx biome check --write {staged_files}
    typecheck:
      run: bun run typecheck

pre-push:
  commands:
    test:
      run: bun run test

commit-msg:
  commands:
    verasic:
      run: bash .agents/skills/verasic-git-commits-convention/hooks/commit-msg {1}
