# Compose is the single source of truth for Coolify's Docker Compose build pack.
# Domains are assigned per service in the Coolify UI as https://host:PORT — never via `ports:`,
# which binds a global host port and collides across concurrent PR previews.
# No custom networks: Coolify creates the stack network and only Traefik-reachable IPs route.
# See docs/adr/0002-deploy-secrets-doppler-coolify.md

x-app-hardening: &app-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  tmpfs:
    - /tmp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: padelski
      # Required, not defaulted: an empty value makes postgres refuse to initialise a fresh
      # volume, which surfaces as "container is unhealthy" instead of naming the real cause.
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
      POSTGRES_DB: padelski
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padelski -d padelski"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Cache-only until app code uses Redis for durable state (redis.io persistence docs).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    <<: *app-hardening
    environment:
      # Only the Doppler service token is stored in Coolify; the CLI fetches the rest at start.
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:?}
      # read_only rootfs: the Doppler CLI needs a writable config dir (docs.doppler.com/docs/dockerfile).
      DOPPLER_CONFIG_DIR: /tmp/.doppler
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      PORT: "3001"
      DB_URL: postgresql://padelski:${SERVICE_PASSWORD_POSTGRES:?}@postgres:5432/padelski
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: padelski-api
      # Per-deployment URLs: each PR preview gets a generated subdomain no secret store can know.
      # Coolify injects SERVICE_URL_<SERVICE> (no port suffix) from the domain set in its UI; the
      # port lives in that domain field and is not part of the public origin.
      NEXT_PUBLIC_API_URL: ${SERVICE_URL_API:?}
      NEXT_PUBLIC_APP_URL: ${SERVICE_URL_WEB:?}
      BETTER_AUTH_URL: ${SERVICE_URL_API:?}
      API_CORS_ORIGIN: ${SERVICE_URL_WEB:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${SERVICE_URL_WEB:?}
        NEXT_PUBLIC_API_URL: ${SERVICE_URL_API:?}
    restart: unless-stopped
    <<: *app-hardening
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0755
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${SERVICE_URL_API:?}
      NEXT_PUBLIC_APP_URL: ${SERVICE_URL_WEB:?}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
