# Pattern A: host env from `doppler run` reaches containers only via explicit `environment:` entries.
# Validation: `doppler:validate` + t3-env at runtime — no compose error-message fallbacks.
# See docs/adr/0002-deploy-secrets-doppler-coolify.md

x-doppler-api-env: &doppler-api-env
  APP_ENV: ${APP_ENV}
  API_CORS_ORIGIN: ${API_CORS_ORIGIN}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  EMAIL_FROM: ${EMAIL_FROM}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
  RESEND_API_KEY: ${RESEND_API_KEY}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  NODE_ENV: production

x-doppler-web-env: &doppler-web-env
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

x-app-hardening: &app-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  tmpfs:
    - /tmp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: padelski
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: padelski
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datastore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padelski -d padelski"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Cache-only until app code uses Redis for durable state (redis.io persistence docs).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - datastore
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    <<: *app-hardening
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      <<: *doppler-api-env
      PORT: "3001"
      DB_URL: postgresql://padelski:${POSTGRES_PASSWORD}@postgres:5432/padelski
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: padelski-api
    networks:
      - default
      - datastore
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    <<: *app-hardening
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0755
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *doppler-web-env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  datastore:
    internal: true

volumes:
  postgres_data:
